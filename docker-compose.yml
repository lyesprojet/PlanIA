services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: plania
    ports:
      - '5432:5432'
    volumes:
      - db_data:/var/lib/postgresql/data

  ollama:
    image: ollama/ollama
    ports:
      - '11434:11434'
    volumes:
      - ollama_data:/root/.ollama

volumes:
  db_data:
  ollama_data:
